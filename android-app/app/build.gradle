apply plugin: 'com.android.application'

android {
    namespace 'com.cs663.dogbackend'
    compileSdk 35

    defaultConfig {
        applicationId "com.cs663.dogbackend"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
        // Real phones (and Apple-silicon emulators) are arm64. 32-bit ARM is
        // kept too: Android Go and other budget phones run a 32-bit userspace,
        // and both MediaPipe tasks-vision and LiteRT ship armeabi-v7a builds.
        // x86/x86_64 are left out because MediaPipe ships no x86 build.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The two on-device models are memory-mapped from assets, which only
    // works if the files are stored uncompressed in the APK.
    androidResources {
        noCompress 'tflite'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Align kotlin-stdlib-jdk7/jdk8 (pulled in by MediaPipe) with the
    // stdlib that androidx pulls in, or the build fails on duplicates.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    // Lifecycle owner for CameraX.
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // CameraX: live preview + an ImageAnalysis stream of upright frames.
    def camerax = '1.4.2'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // Model C: pretrained EfficientDet-Lite0 (COCO) dog detector,
    // run on-device through MediaPipe Tasks.
    implementation 'com.google.mediapipe:tasks-vision:0.10.26.1'

    // Model A: the group's fine-tuned MobileNetV3Small posture
    // classifier (model_a.tflite), run on-device with LiteRT (TensorFlow Lite runtime, 16 KB-page aligned).
    implementation 'com.google.ai.edge.litert:litert:1.4.0'

    testImplementation 'junit:junit:4.13.2'
}
